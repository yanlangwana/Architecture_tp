[project]
name = "tp-bigdata-lakehouse"
version = "0.2.0"
description = "TP Big Data Lakehouse : HDFS 3.5 (3 DataNodes) + PySpark 4.2 + Delta Lake 4.4 + Streamlit"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pyspark==4.2.0",
    "delta-spark==4.4.1",
    "jupyterlab>=4.6,<5.0",
    "ipykernel>=7.4",
    "ipywidgets>=8.1",
    "nbconvert>=7.17",
    "streamlit>=1.67",
    "plotly>=7.1",
    "matplotlib>=3.11",
    "seaborn>=0.13.2",
    "pandas>=3.1",
    "pyarrow>=26.0",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "kagglehub>=1.0",
    "ruff>=0.17",
    "pytest>=9.2",
    "mlflow>=3.18",
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28",
    "requests>=2.32",
]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fraudlake", "serving"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
